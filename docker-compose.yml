services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opencritique
      POSTGRES_PASSWORD: opencritique
      POSTGRES_DB: opencritique
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencritique -d opencritique"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - opencritique_pgdata:/var/lib/postgresql/data
  registry:
    build:
      context: .
    command: opencritique-registry serve --host 0.0.0.0 --port 8000 --execution-mode compose
    environment:
      OPENCRITIQUE_DATABASE_URL: postgresql+psycopg://opencritique:opencritique@postgres:5432/opencritique
      OPENCRITIQUE_ARTIFACT_ROOT: /app/opencritique-artifacts
      OPENCRITIQUE_EXECUTION_MODE: compose
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./:/app
    working_dir: /app

volumes:
  opencritique_pgdata:
