[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencritique-commons"
version = "0.6.0a0"
description = "Open scientific-critique schemas, human adjudication, deterministic evaluation, and public scorecards."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "OpenCritique Commons contributors"}]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "uvicorn>=0.34,<1",
  "cryptography>=46,<47",
]

[project.urls]
Homepage = "https://github.com/fraware/OpenCritique-Commons"
Repository = "https://github.com/fraware/OpenCritique-Commons"
Issues = "https://github.com/fraware/OpenCritique-Commons/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9",
  "pyright>=1.1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]
# Real upstream Coarse (import name `coarse`). Pin matches COARSE_LIVE_COMMIT_PIN
# (tag v1.8.0 / 907c629369a8cf5b776dc1d23c618d2907de6d5b).
live-coarse = [
  "coarse-ink==1.8.0",
  "python-dotenv>=1.0,<2",
]
# OpenReviewer local HF inference (GPU recommended). Does not use OpenAI/BYOK keys.
live-openreviewer = [
  "transformers>=4.40,<5",
  "torch>=2.2,<3",
  "accelerate>=0.30,<2",
]

[project.scripts]
opencritique = "opencritique_schema.cli:app"
opencritique-registry = "opencritique_registry.cli:app"
opencritique-acquisition = "opencritique_acquisition.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042", "B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", "dist", "build", ".venv"]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.setuptools.package-data]
opencritique_registry = ["studio_assets/*"]
