[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencritique-commons"
version = "0.5.0a1"
description = "Open scientific-critique schemas, human adjudication, deterministic evaluation, and public scorecards."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "OpenCritique Commons contributors"}]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "uvicorn>=0.34,<1",
  "cryptography>=46,<47",
]

[project.urls]
Homepage = "https://github.com/fraware/OpenCritique-Commons"
Repository = "https://github.com/fraware/OpenCritique-Commons"
Issues = "https://github.com/fraware/OpenCritique-Commons/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9",
  "pyright>=1.1",
  "httpx>=0.28,<1",
]

[project.scripts]
opencritique = "opencritique_schema.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042", "B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.setuptools.package-data]
opencritique_registry = ["studio_assets/*"]
