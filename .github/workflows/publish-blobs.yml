name: Publish verified source from immutable blobs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[blob publication complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct wheel base64 from immutable Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          shas = [
              'fc2bcae1fae45d382fd4eefe4b8fd0ca17e6d0ec',
              '8ac78d97edfd35dc3ff0cc62cf5e0835f10a78a8',
              'edcc39b2bd6703aa8962b3c860fd4822289a63e8',
              'e6a78554553bd4a26f7d782123915d31c6c1719e',
              'c7bf91ab484496581e183bb9d2a8d93bab8c5238',
              '2964c872b0f4510c7e1514641bf8825a5ea7fbc6',
              '4b87885ee4f8830e959d5f0a29b1c393b5aa5ce0',
              '6b7e6c578634e1c6ad0441a8e7b81081aff97108',
              '65c3732f57fcb757c3fbb14a9d2d30663223ab9e',
              'ab55a5534afc647ff366b189d229114f66368148',
              '4410fa00b0785fd90f601a29239bc2063d9ae4a4',
              '8e1cecb72c0e2bf6883ca66f167d3fd25aad3bc1',
              'bdf9db52bb1b1f2c589d8070d168ebc8f38b4bd8',
              'a87bed55f5b49f5f675554bc65428e70e336b85a',
              '463f7589f6109921657c780184f55288c4bc280d',
              '42d8413af4f4cf2ee89a25e98648dfe6a013d8aa',
              '015d59c2eeed70e92d005ac44f9302c78883c8b4',
              '89277969bfaa2ba9c86d33a8b167d2afc69c60ce',
              'e8fe5d7d6728a49fcb16c3bf212bc8cbb0ee03a8',
              'b9a4cdfb331150f9f1f73fe4a90e8f24dbd8f44d',
              '0e11eaeef5792177d3049bb77de495505fe8392a',
              '10b6716a6cd4170067d316715e4214851b99d897',
              'b1f4ff1ea54218a2d6af4b65b1a9cc5d25fb16fd',
              '02768218e57aa745ab4a1ae96b260a104898a080',
              '030a90a447c9c1bf03c7866c722772af5f8f12e6',
              'cc99ee80eb40d6458dfb947a2a7bd07bb5dc7fc7',
              '535b225249970562d813b87a6a77a717b8ebfe0b',
              '80f99c902bbf2fa0023399f5b840ad5e71ad2cf7',
              '5428a7f12d29edfa28bf25ee353ac07921f8a305',
              'ed8dc659374be3fe73829fd3797d5a1906c7e7ad',
              'fe9c33b517f85d7ac72c9cdbb3061be31dc86d5c',
              '18ea1104063a1d9dbbeb14db0d9d38248e05c357',
              'f6d361c73448841f84d9363c8b97b5cdca039259',
              '9179e76491cbc605c4307c5b99f2d1c6d79c9daf',
              '0c1144fe7945c042835bd1cd54b6e36af68faf7a',
              '31ec6a71dd11b357f90377225d6cc4dde8cfc3fa',
              'a8d707c31cb35c4a981b56348bd190e2769ead4c',
              '8553b64f2a1dacb2e5065183a4668e0e41122dc9',
          ]
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target = Path('/tmp/opencritique.whl.b64')
          with target.open('wb') as output:
              for sha in shas:
                  request = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                      headers={
                          'Authorization': f'Bearer {token}',
                          'Accept': 'application/vnd.github+json',
                          'X-GitHub-Api-Version': '2022-11-28',
                      },
                  )
                  with urllib.request.urlopen(request) as response:
                      payload = json.load(response)
                  if payload.get('encoding') != 'base64':
                      raise RuntimeError(f'Unexpected encoding for blob {sha}')
                  output.write(base64.b64decode(payload['content']))
          PY
          base64 --decode /tmp/opencritique.whl.b64 > /tmp/opencritique.whl
          echo "fdb22e4266b973f277b06b950040ffbffb121913b2b1d127f1aec9440d9dbf83  /tmp/opencritique.whl" | sha256sum --check --strict
      - name: Extract source packages and license
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = Path('/tmp/opencritique.whl')
          destination = Path('src')
          allowed = (
              'opencritique_acquisition/',
              'opencritique_adapters/',
              'opencritique_evaluation/',
              'opencritique_registry/',
              'opencritique_schema/',
          )
          destination.mkdir(exist_ok=True)
          with zipfile.ZipFile(wheel) as archive:
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  if item.filename.startswith(allowed):
                      target = destination / item.filename
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(item))
                  elif item.filename.endswith('.dist-info/licenses/LICENSE'):
                      Path('LICENSE').write_bytes(archive.read(item))
          PY
          test -f src/opencritique_schema/models.py
          test -f src/opencritique_registry/api.py
          test -f src/opencritique_evaluation/engine.py
          test -f LICENSE
      - name: Install and validate extracted source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q src
          pytest -q
      - name: Commit verified source and remove all repair machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/publish-blobs.yml
          rm -f .github/workflows/publish-main.yml
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/repair-publish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish verified OpenCritique Commons source [blob publication complete]'
          git push origin HEAD:main
