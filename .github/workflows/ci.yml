name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party Actions are pinned to full commit SHAs (release tags in comments).
# Bump SHAs intentionally; do not float on mutable tags like @v4 or @v5.
# Match pin style used in .github/workflows/publish-pypi.yml.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Validate
        run: bash scripts/check.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests scripts
      - name: Pyright
        run: pyright

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and sdist
        run: python -m build
      - name: Inspect sdist runtime assets
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path
          archive = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(archive, "r:gz") as tf:
              names = set(tf.getnames())
          required = [
              "openapi/registry.openapi.json",
              "docs/deployment-local.md",
              "docs/deployment-byok.md",
              "trust/scorecard-trust-store.json",
              "corpus/samples/sample-econ-01/manuscript.md",
              "cases/reference/REF-01/case.json",
              "migrations/env.py",
          ]
          for item in required:
              assert any(name.endswith(item) for name in names), item
          print("sdist runtime assets OK")
          PY
      - name: Install wheel in clean venv and import packages
        run: |
          python -m venv /tmp/oc-wheel
          /tmp/oc-wheel/bin/pip install --upgrade pip
          /tmp/oc-wheel/bin/pip install dist/*.whl
          /tmp/oc-wheel/bin/python - <<'PY'
          import opencritique_schema
          import opencritique_registry
          import opencritique_evaluation
          import opencritique_adapters
          import opencritique_acquisition
          import opencritique_ingestion
          import opencritique_verification
          from opencritique_schema.registry import SCHEMA_FREEZE_RELEASE
          assert SCHEMA_FREEZE_RELEASE == "0.5.0a1"
          print("wheel import OK")
          PY
      - name: Install sdist in clean venv and import packages
        run: |
          python -m venv /tmp/oc-sdist
          /tmp/oc-sdist/bin/pip install --upgrade pip
          /tmp/oc-sdist/bin/pip install dist/*.tar.gz
          /tmp/oc-sdist/bin/python - <<'PY'
          import opencritique_schema, opencritique_registry, opencritique_evaluation
          import opencritique_adapters, opencritique_acquisition
          import opencritique_ingestion, opencritique_verification
          print("sdist import OK")
          PY
      - name: Release manifest and SBOM
        run: |
          python -m pip install -e '.[dev]'
          python scripts/build_release_manifest.py dist

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Secret scan
        run: python scripts/secret_scan.py

  publication-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Publication tests
        run: pytest -q tests/test_repository_publication.py tests/test_schema_freeze.py tests/test_openapi_freeze.py
      - name: Migration path
        run: pytest -q tests/test_migrations.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Index digest for tag postgres:16-alpine (multi-arch); bump intentionally.
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: opencritique
          POSTGRES_PASSWORD: opencritique
          POSTGRES_DB: opencritique
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencritique -d opencritique"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENCRITIQUE_DATABASE_URL: postgresql+psycopg://opencritique:opencritique@localhost:5432/opencritique
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Migrate Postgres
        run: alembic upgrade head
      - name: Registry integration tests
        run: pytest -q tests/test_migrations.py tests/test_novel_determinations.py tests/test_matcher_audit.py tests/test_import_reference.py tests/test_rights_path.py
      - name: Reference runtime smoke
        run: python scripts/reference_runtime_smoke.py --artifact-root ./.runtime-smoke-artifacts

  optional-openreviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install with live-openreviewer
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,live-openreviewer]'
      - name: Pyright runners
        run: pyright src/opencritique_runners
      - name: Smoke import HF stack
        run: |
          python - <<'PY'
          from opencritique_runners.hf_local import _require_hf_stack
          torch_mod, factories = _require_hf_stack()
          assert torch_mod is not None
          assert factories[0] is not None and factories[1] is not None
          print("optional-openreviewer smoke import OK")
          PY
