name: Publish verified source

on:
  push:
    branches: [repair/publish-v0.5]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and verify release wheel
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/opencritique.whl.b64
          base64 --decode /tmp/opencritique.whl.b64 > /tmp/opencritique.whl
          echo "fdb22e4266b973f277b06b950040ffbffb121913b2b1d127f1aec9440d9dbf83  /tmp/opencritique.whl" | sha256sum --check --strict
      - name: Extract source packages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = Path('/tmp/opencritique.whl')
          destination = Path('src')
          allowed = (
              'opencritique_acquisition/',
              'opencritique_adapters/',
              'opencritique_evaluation/',
              'opencritique_registry/',
              'opencritique_schema/',
          )
          destination.mkdir(exist_ok=True)
          with zipfile.ZipFile(wheel) as archive:
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  if item.filename.startswith(allowed):
                      target = destination / item.filename
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(item))
                  elif item.filename.endswith('.dist-info/licenses/LICENSE'):
                      Path('LICENSE').write_bytes(archive.read(item))
          PY
          test -f src/opencritique_schema/models.py
          test -f src/opencritique_registry/api.py
          test -f src/opencritique_evaluation/engine.py
          test -f LICENSE
      - name: Install and validate extracted source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q src
          pytest -q
      - name: Replace bootstrap transport with verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish verified OpenCritique Commons source [bootstrap complete]'
          git push origin HEAD:repair/publish-v0.5
