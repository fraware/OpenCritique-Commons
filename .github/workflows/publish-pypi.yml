name: Publish to PyPI

# Trusted Publisher (OIDC) upload for opencritique-commons.
# Full validation gate: core CI for this commit, scripts/check.sh,
# clean wheel/sdist install, GitHub provenance attestation, PEP 740
# attestations on upload, pinned Action SHAs, protected env approval.
# See docs/release-pypi.md.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate only; skip PyPI upload
        type: boolean
        default: true
      target:
        description: Publish target when dry_run is false
        type: choice
        options:
          - pypi
          - testpypi
        default: pypi
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Third-party Actions are pinned to full commit SHAs (release tags in comments).
# Bump SHAs intentionally; do not float on mutable tags like @v4 or @release/v1.

jobs:
  verify-core-ci:
    name: Verify core CI for commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Require successful core CI for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Core jobs from .github/workflows/ci.yml (optional-openreviewer is not required).
          REQUIRED_EXACT=(lint packaging secret-scan publication-audit postgres)
          REQUIRED_TEST_MATRIX=("test (3.12)" "test (3.13)")

          deadline=$((SECONDS + 900))
          run_id=""
          while true; do
            runs_json="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=50")"
            run_id="$(printf '%s' "$runs_json" | jq -r '
              [.workflow_runs[]
                | select(.status == "completed" and .conclusion == "success")
              ] | .[0].id // empty
            ')"
            if [ -n "$run_id" ]; then
              break
            fi

            in_flight="$(printf '%s' "$runs_json" | jq '
              [.workflow_runs[]
                | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")
              ] | length
            ')"
            if [ "$in_flight" -eq 0 ]; then
              echo "No successful CI workflow run for commit ${SHA}." >&2
              printf '%s' "$runs_json" | jq -r '
                .workflow_runs[:5][]?
                | "  run \(.id) event=\(.event) status=\(.status) conclusion=\(.conclusion // "null") \(.html_url)"
              ' >&2 || true
              echo "Push or open a PR so CI runs for this SHA, wait for green core jobs, then re-run publish." >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for CI on ${SHA} (in-flight runs still present)." >&2
              exit 1
            fi
            echo "CI still in flight for ${SHA}; waiting..."
            sleep 30
          done

          echo "Using successful CI run id=${run_id} for ${SHA}"
          jobs_json="$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100")"
          names="$(printf '%s' "$jobs_json" | jq -r '.jobs[].name')"
          missing=0
          for job in "${REQUIRED_EXACT[@]}" "${REQUIRED_TEST_MATRIX[@]}"; do
            if ! printf '%s\n' "$names" | grep -Fxq "$job"; then
              echo "Required core CI job missing from run ${run_id}: ${job}" >&2
              missing=1
            else
              conclusion="$(printf '%s' "$jobs_json" | jq -r --arg n "$job" '
                .jobs[] | select(.name == $n) | .conclusion
              ' | head -n1)"
              if [ "$conclusion" != "success" ]; then
                echo "Required core CI job not successful: ${job} conclusion=${conclusion}" >&2
                missing=1
              fi
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Core CI job inventory:" >&2
            printf '%s' "$jobs_json" | jq -r '.jobs[] | "  \(.name): \(.conclusion // .status)"' >&2
            exit 1
          fi
          echo "Core CI gate OK for ${SHA} (run ${run_id})"

  validate:
    name: check.sh + clean install
    needs: verify-core-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Assert tag matches pyproject version (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"], end="")
          PY
          )"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match pyproject version tag $EXPECTED" >&2
            exit 1
          fi
          echo "Tag/version OK: $TAG"

      - name: Run scripts/check.sh
        run: bash scripts/check.sh

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Inspect sdist runtime assets
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path
          archive = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(archive, "r:gz") as tf:
              names = set(tf.getnames())
          required = [
              "openapi/registry.openapi.json",
              "docs/deployment-local.md",
              "docs/deployment-byok.md",
              "trust/scorecard-trust-store.json",
              "corpus/samples/sample-econ-01/manuscript.md",
              "cases/reference/REF-01/case.json",
              "migrations/env.py",
          ]
          for item in required:
              assert any(name.endswith(item) for name in names), item
          print("sdist runtime assets OK")
          PY

      - name: Install wheel in clean venv and import packages
        run: |
          python -m venv /tmp/oc-wheel
          /tmp/oc-wheel/bin/pip install --upgrade pip
          /tmp/oc-wheel/bin/pip install dist/*.whl
          /tmp/oc-wheel/bin/python - <<'PY'
          import opencritique_schema
          import opencritique_registry
          import opencritique_evaluation
          import opencritique_adapters
          import opencritique_acquisition
          import opencritique_ingestion
          import opencritique_verification
          from opencritique_schema.registry import SCHEMA_FREEZE_RELEASE
          assert SCHEMA_FREEZE_RELEASE == "0.5.0a1"
          print("wheel import OK")
          PY

      - name: Install sdist in clean venv and import packages
        run: |
          python -m venv /tmp/oc-sdist
          /tmp/oc-sdist/bin/pip install --upgrade pip
          /tmp/oc-sdist/bin/pip install dist/*.tar.gz
          /tmp/oc-sdist/bin/python - <<'PY'
          import opencritique_schema, opencritique_registry, opencritique_evaluation
          import opencritique_adapters, opencritique_acquisition
          import opencritique_ingestion, opencritique_verification
          print("sdist import OK")
          PY

      - name: Release manifest and SBOM
        run: python scripts/build_release_manifest.py dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: |
            dist/RELEASE_MANIFEST.json
            dist/SHA256SUMS
            dist/sbom.cdx.json

  publish:
    name: Upload to package index
    needs: validate
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    # Protected GitHub Environments: configure required reviewers on `pypi`
    # (and optionally `testpypi`) so upload waits for human approval.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && 'testpypi' || 'pypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 digital attestations (default on; set explicitly).
          attestations: true

      - name: Publish to TestPyPI
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
